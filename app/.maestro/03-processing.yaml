# 03 — The job polls until completion and the app becomes readable.
#
# Prerequisite: 02-upload.yaml ran (a job is in flight). The mock backend
# completes jobs ~12 seconds after creation.
appId: com.readalong.app
---
- launchApp

# Home shows live processing state while the job runs.
- assertVisible:
    id: "processing-percent"

# When the job completes the app returns to Home with a ready book.
- extendedWaitUntil:
    visible:
      id: "book-action-button"
    timeout: 120000
- assertVisible: "Start Reading"
