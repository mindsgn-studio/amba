# 06 — The single-book rule: no second upload while a book exists.
#
# Prerequisite: any earlier flow created a book (e.g. 03-processing.yaml).
appId: com.readalong.app
---
- launchApp

# A stored book is present...
- assertVisible:
    id: "book-action-button"

# ...so the upload affordance must be hidden.
- assertNotVisible:
    id: "upload-book-button"
- assertNotVisible: "Add a book to begin"
